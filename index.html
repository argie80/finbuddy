<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinBuddy">
<title>FinBuddy · Σύνδεση</title>
<style>
:root { --bg:#080b11; --surface:#101622; --ink:#ecf2fc; --ink-2:#aebcd0; --ink-3:#7c8ca5; --line:#202b3d; --accent:#1d5bd6; --accent-soft:#162847; --down:#f08a72; }
@media (prefers-color-scheme: light) { :root { --bg:#f5f7fb; --surface:#ffffff; --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b; --line:#dde4ee; --accent:#1d4ed8; --accent-soft:#dbeafe; --down:#b4432f; } }
* { box-sizing:border-box; }
html, body { margin:0; min-height:100dvh; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; -webkit-text-size-adjust:100%; }
.auth-gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; }
.auth-card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px 24px 24px; display:flex; flex-direction:column; gap:16px; box-shadow:0 16px 42px rgba(0,0,0,0.22); }
.auth-head { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.auth-title { font-size:23px; font-weight:700; display:inline-flex; align-items:center; gap:9px; letter-spacing:-0.02em; }
.auth-sub { font-size:12.5px; color:var(--ink-2); line-height:1.4; }
.auth-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:3px 10px; border-radius:999px; }
.auth-form { display:flex; flex-direction:column; gap:12px; margin:0; }
.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:12px; font-weight:600; color:var(--ink-2); }
.inp-wrap { position:relative; display:flex; align-items:center; }
.inp-wrap input { width:100%; font:15px system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:11px 12px; min-height:44px; outline:none; transition:border-color .15s; }
.inp-wrap input:focus { border-color:var(--accent); }
.inp-wrap input.has-eye { padding-right:42px; }
.eye-btn { position:absolute; right:6px; border:0; background:transparent; color:var(--ink-3); padding:8px; cursor:pointer; border-radius:8px; display:inline-flex; align-items:center; }
.rem-row { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); cursor:pointer; user-select:none; }
.rem-row input { width:16px; height:16px; accent-color:var(--accent); }
.auth-err { font-size:12.5px; color:var(--down); background:rgba(240,138,114,0.12); border:1px solid var(--down); border-radius:9px; padding:8px 11px; text-align:center; }
.auth-btn { border:0; background:var(--accent); color:#ffffff; font:600 15px system-ui,-apple-system,sans-serif; min-height:46px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity .15s; }
.auth-btn:hover:not(:disabled) { opacity:0.92; }
.auth-btn:disabled { opacity:0.6; cursor:wait; }
</style>
</head>
<body>
<div class="auth-gate" id="authGate" hidden>
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-title">
        <svg width="32" height="32" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" rx="10" fill="#1d5bd6"/><path d="M25.2 9.2C24.4 7.6 23.6 7.2 22.4 7.2C20.2 7.2 19.3 9.0 18.8 12.2L17.2 23.8C16.7 27.0 15.8 28.8 13.6 28.8C12.4 28.8 11.6 28.4 10.8 26.8" stroke="#fff" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.8 16.2H22.8" stroke="#fff" stroke-width="2.9" stroke-linecap="round"/></svg>
        <span>Fin<span style="color:var(--accent)">Buddy</span></span>
      </div>
      <span class="auth-badge">🔒 Κρυπτογράφηση AES-256 · PBKDF2-SHA256</span>
      <div class="auth-sub">Συνδεθείτε με το Gmail και τον κωδικό σας για αποκρυπτογράφηση των δεδομένων</div>
    </div>
    <form class="auth-form" id="authForm" autocomplete="on">
      <div class="field">
        <label for="authEmail">Λογαριασμός Gmail</label>
        <div class="inp-wrap">
          <input type="email" id="authEmail" name="username" autocomplete="username" placeholder="name@gmail.com" required>
        </div>
      </div>
      <div class="field">
        <label for="authPass">Κωδικός Πρόσβασης</label>
        <div class="inp-wrap">
          <input type="password" id="authPass" name="password" class="has-eye" autocomplete="current-password" placeholder="••••••••••••" required>
          <button type="button" class="eye-btn" id="eyeBtn" aria-label="Εμφάνιση κωδικού">👁</button>
        </div>
      </div>
      <label class="rem-row">
        <input type="checkbox" id="authRem" checked>
        <span>Απομνημόνευση σε αυτή τη συσκευή (iPad / iPhone)</span>
      </label>
      <div class="auth-err" id="authErr" hidden>Λάθος Gmail ή κωδικός πρόσβασης.</div>
      <button type="submit" class="auth-btn" id="authBtn">Σύνδεση & Αποκρυπτογράφηση</button>
    </form>
  </div>
</div>

async function decryptWithRawKey(rawKeyBytes) {
  try {
    const aesKey = await crypto.subtle.importKey("raw", rawKeyBytes, { name: "AES-CBC" }, false, ["decrypt"]);
    const decBuf = await crypto.subtle.decrypt({ name: "AES-CBC", iv: b64ToBytes(ENC.i) }, aesKey, b64ToBytes(ENC.c));
    const text = new TextDecoder().decode(decBuf);
    if (!text.startsWith("FINBUDDY_OK:")) return false;
    document.open();
    document.write(text.slice(12));
    document.close();
    return true;
  } catch (e) {
    return false;
  }
}
async function deriveAndUnlock(email, password, remember) {
  try {
    const combo = email.trim().toLowerCase() + ":" + password;
    const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(combo), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64ToBytes(ENC.s), iterations: ENC.it, hash: "SHA-256" }, baseKey, 256);
    const rawBytes = new Uint8Array(bits);
    const ok = await decryptWithRawKey(rawBytes);
    if (ok && remember) {
      try { localStorage.setItem(STORAGE_KEY, bytesToB64(rawBytes)); } catch (e) {}
    }
    return ok;
  } catch (e) {
    return false;
  }
}
(async () => {
  try {
    const savedKeyB64 = localStorage.getItem(STORAGE_KEY);
    if (savedKeyB64 && await decryptWithRawKey(b64ToBytes(savedKeyB64))) return;
  } catch (e) {}
  const gate = document.getElementById("authGate");
  gate.hidden = false;
  const eyeBtn = document.getElementById("eyeBtn");
  const passInp = document.getElementById("authPass");
  eyeBtn.addEventListener("click", () => {
    passInp.type = passInp.type === "password" ? "text" : "password";
  });
  document.getElementById("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("authBtn");
    const err = document.getElementById("authErr");
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = "Αποκρυπτογράφηση AES-256...";
    const email = document.getElementById("authEmail").value;
    const pass = passInp.value;
    const rem = document.getElementById("authRem").checked;
    const ok = await deriveAndUnlock(email, pass, rem);
    if (!ok) {
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = "Σύνδεση & Αποκρυπτογράφηση";
    }
  });
})();
