<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
{
  try {
    const th = localStorage.getItem("fin-theme");
    if (th === "dark" || th === "light") {
      document.documentElement.setAttribute("data-theme", th);
      document.querySelector('meta[name="color-scheme"]').content = th;
    }
  } catch (e) {}
}
</script>
<title>Household Expenses</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ledger-style column. Filters on top, KPI strip, monthly chart full width, then category + merchant side by side, then the ledger table. */
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --ink: #0f172a;
  --ink-2: #475569;
  --ink-3: #64748b;
  --line: #dde4ee;
  --line-soft: #edf1f7;
  --accent: #1d4ed8;
  --accent-soft: #dbeafe;
  --alpha: #2a78d6;
  --nbg: #1baf7a;
  --areti: #7c3aed;
  --bar: #2a78d6;
  --refund: #0a7d43;
  --up: #b4432f;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light dark;
}
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080b11; --surface: #101622; --ink: #ecf2fc; --ink-2: #aebcd0; --ink-3: #7c8ca5;
    --line: #202b3d; --line-soft: #161f2e; --accent: #3b82f6; --accent-soft: #172554;
    --alpha: #3987e5; --nbg: #199e70; --areti: #a78bfa; --bar: #3987e5; --refund: #4cc98a; --up: #f08a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080b11; --surface: #101622; --ink: #ecf2fc; --ink-2: #aebcd0; --ink-3: #7c8ca5;
  --line: #202b3d; --line-soft: #161f2e; --accent: #3b82f6; --accent-soft: #172554;
  --alpha: #3987e5; --nbg: #199e70; --areti: #a78bfa; --bar: #3987e5; --refund: #4cc98a; --up: #f08a72; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px; -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lucide { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; vertical-align: -2px; }
h1 .lucide { width: 28px; height: 28px; stroke-width: 2.2; color: var(--accent); vertical-align: -4px; margin-right: 4px; }
h2 .lucide { width: 18px; height: 18px; color: var(--accent); vertical-align: -3px; margin-right: 6px; }
.sub { color: var(--ink-2); margin: 6px 0 0; }
.head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.sources { display: flex; gap: 8px; flex-wrap: wrap; }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: 500 13.5px var(--font-body); padding: 6px 13px; min-height: 34px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: background .15s ease, color .15s ease, border-color .15s ease; white-space: nowrap; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--line-soft); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #ffffff; font-weight: 600; box-shadow: 0 1px 3px rgba(29, 78, 216, 0.25); }
.seg button.year-drill { border: 1px dashed var(--line); background: var(--bg); color: var(--ink-2); font-size: 12.5px; padding: 5px 11px; min-height: 32px; }
.seg button.year-drill:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.seg button.year-drill.is-open { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); padding: 5px 9px; }
.seg button.year-drill .lucide { width: 14px; height: 14px; }
.seg button.year-old { animation: yearDrillIn .18s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes yearDrillIn { from { opacity: 0; transform: translateX(8px) scale(0.95); } to { opacity: 1; transform: translateX(0) scale(1); } }
.seg-cnt { font-family: var(--font-mono); font-size: 11px; opacity: 0.78; font-weight: 500; }
.seg button[aria-pressed="true"] .seg-cnt { opacity: 0.92; }
.smart-ctrl { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px; min-height: 40px; transition: border-color .15s, background .15s; }
.smart-ctrl.is-active { border-color: var(--accent); background: var(--accent-soft); }
.smart-ctrl .ctrl-ico { color: var(--ink-3); margin-left: 8px; margin-right: 2px; display: inline-flex; align-items: center; pointer-events: none; }
.smart-ctrl.is-active .ctrl-ico { color: var(--accent); }
.smart-ctrl select { border: 0; background: transparent; color: var(--ink); font: 500 13.5px var(--font-body); padding: 6px 8px; min-height: 34px; cursor: pointer; outline: none; }
.smart-ctrl.is-active select { color: var(--accent); font-weight: 600; }
.nav-step { border: 0; background: transparent; color: var(--ink-2); width: 28px; height: 28px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: background .15s, color .15s; }
.nav-step:hover:not(:disabled) { background: var(--line-soft); color: var(--accent); }
.nav-step:disabled { opacity: 0.3; cursor: default; }
.mob-search-btn { display: none; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; padding: 0; flex: none; }
.mob-search-btn.is-open { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.smart-search { position: relative; flex: 1 1 200px; min-width: 170px; display: flex; align-items: center; }
.smart-search .s-ico { position: absolute; left: 12px; color: var(--ink-3); pointer-events: none; display: inline-flex; }
.smart-search input[type="search"] { width: 100%; font: 13.5px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 78px 8px 34px; min-height: 40px; transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; appearance: none; }
.smart-search input[type="search"]::-webkit-search-cancel-button { display: none; }
.smart-search input[type="search"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.smart-search.is-active input[type="search"] { border-color: var(--accent); background: var(--accent-soft); }
.smart-search .s-meta { position: absolute; right: 8px; display: inline-flex; align-items: center; gap: 4px; }
.smart-search .s-badge { font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.smart-search .s-clear { border: 0; background: var(--line-soft); color: var(--ink-2); width: 24px; height: 24px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.smart-search .s-clear:hover { background: var(--accent); color: #ffffff; }
select { font: 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px var(--font-body); background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent); border-radius: 999px; padding: 5px 11px; min-height: 32px; cursor: pointer; transition: background .15s, color .15s; }
.chip:hover { background: var(--accent); color: #ffffff; }
.chip.chip-reset { background: var(--surface); color: var(--ink-2); border-color: var(--line); }
.chip.chip-reset:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
button:focus-visible, select:focus-visible, input:focus-visible, .row-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kpi { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.kpi .label .lucide { width: 14px; height: 14px; color: var(--accent); }
.kpi .value { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .note { font-size: 12px; color: var(--ink-2); }
.kpi .note:empty { display: none; }
.up { color: var(--up); } .down { color: var(--refund); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 12px; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 19px; margin: 0; }
.hint { font-size: 12px; color: var(--ink-3); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font: 11px var(--font-mono); }
.chart .gridline { stroke: var(--line-soft); }
.chart .base { stroke: var(--line); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .total { fill: var(--ink-2); font-weight: 500; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.12); min-width: 150px; z-index: 2; }
.tip b { display: block; font-weight: 600; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }

.bars { display: flex; flex-direction: column; gap: 2px; }
.row-btn { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 2fr) 84px 44px; align-items: center; gap: 10px; padding: 8px 6px; min-height: 40px; border-radius: 6px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%; }
.row-btn:hover { background: var(--line-soft); }
.row-btn[aria-pressed="true"] { background: var(--accent-soft); }
.row-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.row-btn .name .lucide { width: 14px; height: 14px; color: var(--ink-3); }
.row-btn .track { height: 10px; position: relative; }
.row-btn .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.row-btn .amt { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.row-btn .pct, .row-btn .cnt { text-align: right; color: var(--ink-3); font-size: 12px; font-family: var(--font-mono); }
.dim .fill { opacity: 0.35; }
#merchants .row-btn { cursor: pointer; }
#merchants .row-btn:hover { background: var(--line-soft); }

/* Gemini AI Categorizer & Audit Panel */
.ai-panel { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 68px); transition: padding .15s ease; container-type: inline-size; }
.ai-panel.is-minimized { background: linear-gradient(90deg, var(--accent-soft) 0%, var(--surface) 75%); padding-block: 12px; }
.ai-panel.is-minimized .panel-head { margin-bottom: 0; }
.ai-head-left { display: flex; flex-direction: column; gap: 4px; cursor: pointer; user-select: none; min-width: 0; flex: 1; }
.ai-head-title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ai-head-title-row h2 { font-size: clamp(1rem, 0.9rem + 0.5vw, 1.2rem); }
.ai-last-check { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; color: var(--accent); background: var(--surface); border: 1px solid var(--line); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.ai-last-check .lucide { width: 12px; height: 12px; }
.btn-primary, .btn-ghost { display: inline-flex; align-items: center; gap: 6px; font: 500 13px var(--font-body); border-radius: 8px; padding: 7px 12px; min-height: 36px; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--accent); color: #ffffff; border: 1px solid var(--accent); }
.btn-primary:disabled { opacity: 0.65; cursor: wait; }
.btn-ghost { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--line-soft); color: var(--ink); }
.ai-min-btn { padding: 6px 11px; min-height: 34px; font-size: 12.5px; flex: none; }
.ai-body-wrap { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.ai-ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; justify-content: space-between; }
.ai-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#expAiScopeSeg { display: inline-flex; flex-wrap: wrap; border-radius: 10px; max-width: 100%; padding: 3px; gap: 2px; }
#expAiScopeSeg button { border-radius: 7px; min-width: 0; }
.ai-key-box { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ai-key-input-wrap { position: relative; flex: 1 1 260px; display: flex; align-items: center; }
.ai-key-input-wrap input { width: 100%; padding-right: 40px; font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); color: var(--ink); }
.ai-key-toggle { position: absolute; right: 6px; border: 0; background: transparent; color: var(--ink-3); padding: 6px; cursor: pointer; border-radius: 6px; display: inline-flex; align-items: center; }
.ai-loader { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 9px; background: var(--accent-soft); color: var(--ink); display: flex; flex-direction: column; gap: 8px; }
.ai-progress { height: 4px; width: 100%; background: var(--line); border-radius: 999px; overflow: hidden; position: relative; }
.ai-progress span { position: absolute; inset: 0; width: 42%; background: var(--accent); border-radius: 999px; animation: ai-slide 1.1s ease-in-out infinite; }
@keyframes ai-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }
.ai-loader-body { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--accent); }
.ai-status { margin-top: 12px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.exp-ai-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
.exp-ai-card-wrap { container-type: inline-size; }
.exp-ai-card { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; height: 100%; }
.exp-ai-card.is-ai-suggested { border-color: var(--accent); }
.exp-ai-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.exp-ai-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.exp-ai-amt { font-family: var(--font-mono); font-weight: 600; font-size: 13.5px; color: var(--ink); }
.exp-ai-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.exp-ai-title button { all: unset; cursor: pointer; color: var(--accent); font: 500 11.5px var(--font-body); display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); }
.exp-ai-title button:hover { background: var(--accent-soft); }
.exp-ai-note { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; flex: 1; }
.exp-ai-foot { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line-soft); margin-top: auto; }
@media (min-width: 600px) {
  .exp-ai-foot { flex-direction: row; align-items: center; justify-content: space-between; }
}
@supports (container-type: inline-size) {
  @media (min-width: 600px) { .exp-ai-foot { flex-direction: column; align-items: stretch; } }
  @container (min-width: 240px) {
    .exp-ai-foot { flex-direction: row; align-items: center; justify-content: space-between; }
  }
}
.cat-sel { font: 500 12px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-height: 30px; max-width: 100%; cursor: pointer; }
.cat-sel.is-custom { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ai-sources { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); }
.ai-sources a, .offer-link { color: var(--accent); text-decoration: none; background: var(--line-soft); padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.ai-sources a:hover, .offer-link:hover { background: var(--accent-soft); }

.table-wrap { overflow: auto; max-height: 560px; border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
th button .lucide { width: 13px; height: 13px; color: var(--ink-3); }
th button:focus-visible { outline: 2px solid var(--accent); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
td.r, th.r { text-align: right; }
td.m { font-weight: 500; word-break: break-word; }
td.muted { color: var(--ink-2); white-space: nowrap; }
.refund { color: var(--refund); }
.tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.more { margin-top: 12px; display: flex; justify-content: center; }
.more button { font: 500 14px var(--font-body); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.foot { color: var(--ink-3); font-size: 12px; max-width: 75ch; }

[hidden] { display: none !important; }
.wrap { container-type: inline-size; }

@media (max-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  body { padding-block: 14px 32px; padding-inline: max(10px, env(safe-area-inset-left, 0px)); }
  .wrap { gap: 12px; }
  .panel { padding: 12px; }
  .head-right { display: none; }
  .sub, .hint, .kpi .note, .foot, .sources .src { font-size: 10.5px; line-height: 1.25; }
  .panel-head .hint, #expAiSub { display: none; }
  .filters { gap: 6px; }

const BILL_CATS = new Set(["bills", "ins", "subs"]);
function passQuick(row, qMode = state.quick) {
  if (!qMode || qMode === "all") return true;
  if (qMode === "big") return row.a >= 50;
  if (qMode === "bills") return BILL_CATS.has(txCat(row));
  if (qMode === "refund") return row.a < 0;
  return true;
}

function filtered(skip) {
  const q = state.q.trim().toUpperCase();
  return TX.filter(t =>
    (!state.year || t.d.startsWith(state.year)) &&

    (skip === "bank" || state.bank === "all" || t.bank === state.bank) &&
    (skip === "month" || !state.month || t.d.startsWith(state.month)) &&
    (skip === "cat" || !state.cat || txCat(t) === state.cat) &&
    (skip === "quick" || passQuick(t)) &&
    (!q || t.m.includes(q)));
}

// Months covered, counting the final data month as a fraction (e.g. 16 of 31 days).
function monthSpan(keys) {
  const lastKey = LAST.slice(0, 7), dim = new Date(+LAST.slice(0, 4), +LAST.slice(5, 7), 0).getDate();
  return keys.reduce((s, m) => s + (m === lastKey ? +LAST.slice(8) / dim : 1), 0);
}

function renderKpis(rows) {
  const total = sum(rows);

  const byBank = BANKS.map(([b]) => [b, sum(rows.filter(t => t.bank === b))]).filter(x => x[1]);

  // Same period of the previous year, when that year is loaded.

  let yoy = "";
  if (prevY && YEARS.includes(prevY)) {
    const cut = state.year === LAST.slice(0, 4) ? LAST.slice(5) : "12-31";
    const q = state.q.trim().toUpperCase();
    const prev = sum(TX.filter(t => t.d.startsWith(prevY) && t.d.slice(5) <= cut &&
      (state.owner === "all" || (t.p || "argiris") === state.owner) &&

    if (prev > 0) {

function renderMonthly() {
  const byYear = !state.year;
  const rows = filtered("month");
  const keys = byYear ? YEARS : MONTHS.map((_, i) => `${state.year}-${String(i + 1).padStart(2, "0")}`);
  $("chartTitle").textContent = byYear ? t("byYear") : t("byMonth", state.year);
  const partial = LAST.slice(0, 4) === (state.year || LAST.slice(0, 4)) && LAST.slice(5) !== "12-31";
  $("chartHint").textContent = (byYear ? t("clickYear") : t("clickMonth")) + (partial ? t("dataTo", `${fmtDate(LAST)} ${LAST.slice(0, 4)}`) : "");
  const box = $("monthly");
  const W = Math.max(300, box.clientWidth), H = W < 520 ? 210 : 260;
  const m = { t: 22, r: 8, b: 26, l: 48 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const data = keys.map(k => {
    const r = rows.filter(t => t.d.startsWith(k));
    return { k, parts: BANKS.map(([b]) => Math.max(0, sum(r.filter(t => t.bank === b)))), n: r.length };
  });
  const max = Math.max(1, ...data.map(d => d.parts.reduce((a, b) => a + b, 0)));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => m.t + ih - v / top * ih;
  const band = iw / data.length, bw = Math.min(byYear ? 72 : 46, band * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chartAria")}">`;
  for (let v = 0; v <= top + 1e-6; v += step) {
    s += `<line class="${v ? "gridline" : "base"}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmtK(v)}</text>`;
  }
  data.forEach((d, i) => {
    const x = m.l + band * i + (band - bw) / 2;
    const dimmed = state.month && state.month !== d.k;
    let base = 0;
    const segs = d.parts.map((v, j) => ({ v, j })).filter(p => p.v > 0);
    segs.forEach((p, idx) => {
      const y0 = y(base), y1 = y(base + p.v);
      const isTop = idx === segs.length - 1;
      const h = Math.max(0, y0 - y1 - (isTop ? 0 : 2));
      const fill = `var(${BANKS[p.j][1]})`;
      s += isTop ? `<path d="${topRounded(x, y0 - h, bw, h, Math.min(4, h))}" fill="${fill}" opacity="${dimmed ? .3 : 1}"/>`
                 : `<rect x="${x}" y="${y0 - h}" width="${bw}" height="${h}" fill="${fill}" opacity="${dimmed ? .3 : 1}"/>`;
      base += p.v;
    });
    const tot = d.parts.reduce((a, b) => a + b, 0);
    if (tot && W >= 520) s += `<text class="total" x="${x + bw / 2}" y="${y(tot) - 6}" text-anchor="middle">${fmtK(tot)}</text>`;
    s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${byYear ? d.k : W < 420 ? MONTHS[+d.k.slice(5) - 1][0] : MONTHS[+d.k.slice(5) - 1]}</text>`;
    if (d.n) s += `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}"/>`;
  });
  s += `</svg><div class="tip" hidden></div>`;
  box.innerHTML = s;
  const tip = box.querySelector(".tip");
  box.querySelectorAll(".hit").forEach(el => {
    const d = data[+el.dataset.i];
    el.addEventListener("mousemove", e => {
      const tot = d.parts.reduce((a, b) => a + b, 0);
      tip.innerHTML = `<b>${byYear ? d.k : monthLabel(d.k)}</b>` + BANKS.map(([b, v], j) =>
        d.parts[j] ? `<div class="r"><span><i class="dot" style="background:var(${v})"></i>${b}</span><span class="num">${eur.format(d.parts[j])}</span></div>` : "").join("") +
        `<div class="r" style="margin-top:4px;border-top:1px solid var(--line);padding-top:4px"><span>${t("totalTx", d.n)}</span><span class="num">${eur.format(tot)}</span></div>`;
      tip.hidden = false;
      const r = box.getBoundingClientRect();
      let left = e.clientX - r.left + 14; if (left + 180 > r.width) left = e.clientX - r.left - 194;
      tip.style.left = Math.max(0, left) + "px"; tip.style.top = Math.max(0, e.clientY - r.top - 40) + "px";
    });
    el.addEventListener("mouseleave", () => tip.hidden = true);
    el.addEventListener("click", () => {
      if (byYear) { state.year = d.k; state.month = ""; }
      else state.month = state.month === d.k ? "" : d.k;
      render();
    });
  });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function topRounded(x, y, w, h, r) { return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }

function renderCats() {
  const rows = filtered("cat");
  const total = sum(rows), by = {};
  rows.forEach(t => { const c = txCat(t); by[c] = (by[c] || 0) + t.a; });
  const list = Object.entries(by).filter(e => Math.abs(e[1]) > 0.005).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...list.map(e => e[1]));
  $("cats").innerHTML = list.map(([k, v]) => `

      <span class="amt">${eur.format(v)}</span><span class="pct">${total ? Math.round(v / total * 100) : 0}%</span>
    </button>`).join("") || `<p class="hint">${t("noSpend")}</p>`;

}

function getApiKey() {
  try { return localStorage.getItem("gemini-api-key") || ""; } catch (e) { return ""; }
}

function toggleExpAiMinimize() {
  expAiMinimized = !expAiMinimized;
  const panel = $("expAiPanel"), body = $("expAiBodyWrap"), btn = $("expAiMinBtn"), head = $("expAiHeadToggle");
  panel.classList.toggle("is-minimized", expAiMinimized);
  body.hidden = expAiMinimized;
  btn.setAttribute("aria-expanded", String(!expAiMinimized));
  head.setAttribute("aria-expanded", String(!expAiMinimized));
  $("expAiMinLbl").textContent = expAiMinimized ? t("aiExpand") : t("aiMinimize");
  const ic = $("expAiMinIcon");
  if (ic) ic.outerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="expAiMinIcon" class="lucide lucide-${expAiMinimized ? "chevron-down" : "chevron-up"}" aria-hidden="true">${LUCIDE[expAiMinimized ? "chevron-down" : "chevron-up"]}</svg>`;
}

function renderExpAiPanel() {
  const inScope = TX.filter(t => !state.year || t.d.startsWith(state.year));
  const totalSpend = sum(inScope) || 1;
  const otherRows = inScope.filter(t => txCat(t) === "other");
  const otherSpend = sum(otherRows);
  const otherMerchMap = {};
  otherRows.forEach(t => {
    const o = otherMerchMap[t.m] || (otherMerchMap[t.m] = { v: 0, n: 0, last: "", bank: t.bank });
    o.v += t.a; o.n++; if (t.d > o.last) o.last = t.d;
  });
  const otherMerchList = Object.entries(otherMerchMap).sort((a, b) => b[1].v - a[1].v);

  $("expAiBadgeTxt").textContent = t("aiBadgeTxt", eur.format(otherSpend), (otherSpend / totalSpend * 100).toFixed(1));
  $("expAiOtherTabLbl").textContent = t("aiScopeOther", otherMerchList.length, eur.format(otherSpend));
  $("expAiResetBtn").hidden = Object.keys(customCats).length === 0;
  $("expAiKeyBtnLbl").textContent = getApiKey() ? t("aiKeySavedBtn") : t("aiKeyBtn");
  $("expAiFetchLbl").textContent = expAiScope === "advisor" ? t("aiFetchAdvisorBtn") : t("aiFetchBtn");

  document.querySelectorAll("#expAiScopeSeg button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.scope === expAiScope));
  });

  const st = $("expAiStatus"), grid = $("expAiGrid");
  if (expAiScope === "audit") {
    st.innerHTML = `<span>${esc(t("aiAuditStatus"))}</span>`;
    grid.innerHTML = AUDIT_HIGHLIGHTS.map(item => {
      const allM = [item.m, ...(item.extraM || [])];
      const mRows = inScope.filter(r => allM.includes(r.m));
      const v = sum(mRows), n = mRows.length;
      const curC = txCat(TX.find(r => r.m === item.m) || { m: item.m, c: "other" });
      return `<div class="exp-ai-card-wrap"><article class="exp-ai-card">
        <div class="exp-ai-top">
          <span class="exp-ai-badge">${ico(CAT_ICONS[curC] || "package")} ${esc(catName(curC))}</span>
          <span class="exp-ai-amt">${eur2.format(v)} · ${n}×</span>
        </div>
        <div class="exp-ai-title">
          <span>${esc(item.m)}${item.extraM && item.extraM.length ? ` +${item.extraM.length}` : ""}</span>
          <button type="button" data-ai-filter="${esc(item.m)}">${ico("receipt")} ${esc(t("aiFilterBtn"))}</button>
        </div>
        <div class="exp-ai-note">${esc(LANG === "el" ? item.noteEl : item.noteEn)}</div>
        <div class="exp-ai-foot">
          <span class="hint">${esc(catName(item.oldCat))} →</span>
          ${buildCatSelectHtml(item.m, curC)}
        </div>
      </article></div>`;
    }).join("");
  } else if (expAiScope === "other") {
    st.innerHTML = `<span>${esc(t("aiOtherStatus", otherMerchList.length, eur2.format(otherSpend)))}</span>`;
    grid.innerHTML = otherMerchList.map(([m, o]) => {
      const curC = txCat({ m, c: "other" });
      const sug = aiSuggestedCats[m];
      return `<div class="exp-ai-card-wrap"><article class="exp-ai-card${sug ? " is-ai-suggested" : ""}">
        <div class="exp-ai-top">
          <span class="exp-ai-badge">${ico(CAT_ICONS[curC] || "package")} ${esc(o.bank)} · ${fmtDate(o.last)} ${o.last.slice(0, 4)}</span>
          <span class="exp-ai-amt">${eur2.format(o.v)} (${o.n}×)</span>
        </div>
        <div class="exp-ai-title">
          <span>${esc(m)}</span>
          <button type="button" data-ai-filter="${esc(m)}">${ico("receipt")} ${esc(t("aiFilterBtn"))}</button>
        </div>
        <div class="exp-ai-note">${sug ? `<b>AI:</b> ${esc(sug.reason)}` : (LANG === "el" ? "Επωνυμία POS φυσικού προσώπου / τοπικής επιχείρησης. Επιλέξτε κατηγορία ή πατήστε Αναγνώριση με Gemini AI." : "Individual POS merchant name. Select a category or run Gemini AI lookup.")}</div>
        <div class="exp-ai-foot">
          ${sug && sug.cat && sug.cat !== curC ? `<button type="button" class="btn-primary" style="min-height:28px;padding:4px 9px;font-size:11.5px" data-ai-apply="${esc(m)}" data-ai-cat="${esc(sug.cat)}">${ico("check")} ${esc(t("aiApplyBtn"))} ${esc(catName(sug.cat))}</button>` : `<span class="hint">${esc(catName(curC))}</span>`}
          ${buildCatSelectHtml(m, curC)}
        </div>
      </article></div>`;
    }).join("");
  } else {
    st.innerHTML = `<span>${esc(t("aiAdvisorStatus"))}</span>`;
    let cards = DEFAULT_ADVISOR_CARDS;
    try {
      const cached = JSON.parse(localStorage.getItem("hx-ai-advisor-cards") || "null");
      if (Array.isArray(cached) && cached.length) cards = cached;
    } catch (e) {}
    grid.innerHTML = cards.map(c => `<div class="exp-ai-card-wrap"><article class="exp-ai-card">
      <div class="exp-ai-top">
        <span class="exp-ai-badge">${ico("sparkles")} ${esc(c.badge)}</span>
        <span class="exp-ai-amt">${esc(c.amt)}</span>
      </div>
      <div class="exp-ai-title">
        <span>${esc(c.title)}</span>
        ${c.filterQ ? `<button type="button" data-ai-filter="${esc(c.filterQ)}">${ico("receipt")} ${esc(t("aiFilterBtn"))}</button>` : ""}
      </div>
      <div class="exp-ai-note">${esc(LANG === "el" ? (c.noteEl || c.note) : (c.noteEn || c.note || c.noteEl))}</div>
    </article></div>`).join("");
  }

  grid.querySelectorAll("[data-merch-cat]").forEach(sel => {
    sel.addEventListener("change", () => setMerchantCat(sel.dataset.merchCat, sel.value));
  });
  grid.querySelectorAll("[data-ai-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.q = btn.dataset.aiFilter;
      $("q").value = state.q;
      state.cat = "";
      state.month = "";
      render();
      $("tbody").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
  });
  grid.querySelectorAll("[data-ai-apply]").forEach(btn => {
    btn.addEventListener("click", () => setMerchantCat(btn.dataset.aiApply, btn.dataset.aiCat));
  });
}

async function runGeminiExpenseAi() {
  if (expAiLoading) return;
  const key = getApiKey();
  if (!key) {
    $("expAiKeyForm").hidden = false;
    $("expAiKeyBtn").setAttribute("aria-expanded", "true");
    $("expAiKeyInput").focus();
    return;
  }
  const loader = $("expAiLoader"), btn = $("expAiFetchBtn"), srcBox = $("expAiSources");
  expAiLoading = true;
  btn.disabled = true;
  loader.hidden = false;

  try {
    const inScope = TX.filter(t => !state.year || t.d.startsWith(state.year));
    const otherRows = inScope.filter(t => txCat(t) === "other");
    const otherMap = {};
    otherRows.forEach(t => {
      const o = otherMap[t.m] || (otherMap[t.m] = { v: 0, n: 0, d: t.d });
      o.v += t.a; o.n++;
    });
    const listLines = Object.entries(otherMap).sort((a, b) => b[1].v - a[1].v).slice(0, 25)
      .map(([m, o]) => `- ${m}: ${o.v.toFixed(2)} EUR (${o.n}x, date ${o.d})`).join("\n");

    const prompt = expAiScope === "advisor"
      ? `Είσαι οικονομικός σύμβουλος ελληνικού νοικοκυριού. Αναλύεις τα ετήσια τραπεζικά έξοδα καρτών:
- Ενέργεια & Τηλεπικοινωνίες (bills): 7.662 € (Enerwave 2.337 €, Elpedison 2.262 €, Nova 1.176 €, Cosmote 530 €, Vodafone 214 €, ΕΥΔΑΠ 238 €)
- Ασφάλειες & Φόροι (ins): 6.626 € (ΑΕΕΓΑ Εθνική Ασφαλιστική 4.771 €, ΔΟΥ 1.321 €, Cover Insurance 463 €)
- Ταξίδια & Μετακινήσεις (travel): 6.323 € (Booking, Fletcher, Aegean, Enterprise, e-Pass 420 €)
- Εστίαση & Καφέ (out): 5.174 € (Dabov 133x 378,50 €, Barbara Que 427,50 € κ.ά.)
- Συνδρομές (subs): 544 € (Apple.com/bill 254 €, Netflix 240 €)
- Ηλεκτρονικά & Δόσεις (tech): 2.160 € (Apothema 641 €, Public 399 €, Κωτσόβολος 300 €)
Ψάξε τρέχοντα προγράμματα στην Ελλάδα και επέστρεψε ΜΟΝΟ JSON array με 6 κάρτες συμβουλών:
[{"badge":"Κατηγορία · Ποσό","title":"Τίτλος","amt":"Ποσό/μήνα ή όφελος","noteEl":"Συγκεκριμένη πρόταση εξοικονόμησης στα Ελληνικά","noteEn":"Specific advice in English","filterQ":"MERCHANT"}]`
      : `Είσαι ειδικός αναγνώρισης ελληνικών επωνυμιών POS (ΓΕΜΗ / Επαγγελματικοί Κατάλογοι).
Για τους παρακάτω εμπόρους από ελληνικές κάρτες (περιοχή Αθήνα / Ίλιον / Αταλάντη / Πάργα / Χαλκίδα / Λιβαδειά):
${listLines}

Διαθέσιμες κατηγορίες: food, out, travel, bills, ins, health, clothes, tech, dept, subs, car, bet, other.
Ψάξε στο web/ΓΕΜΗ τι επιχείρηση ή επαγγελματίας (π.χ. ιατρός -> health, εστίαση -> out, ένδυση -> clothes, κατάστημα/υπηρεσία -> dept) αντιστοιχεί σε κάθε επωνυμία και επέστρεψε ΜΟΝΟ JSON array:
[{"m":"EXACT_MERCHANT_NAME","cat":"health|out|clothes|dept|food|car|ins|travel|tech","reason":"Σύντομη επεξήγηση στα Ελληνικά τι επιχείρηση είναι"}]`;

    const models = ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash"];
    let text = "", sources = [];
    for (const useSearch of [true, false]) {
      if (text) break;
      for (const model of models) {
        try {
          const payload = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.2 } };
          if (useSearch) payload.tools = [{ google_search: {} }];
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.candidates && data.candidates[0]) {
            const cand = data.candidates[0];
            text = ((cand.content && cand.content.parts) || []).map(p => p.text || "").join("\n");
            const chunks = (cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || [];
            sources = chunks.map(c => c.web).filter(w => w && w.uri);
            if (text) break;
          }
        } catch (e) {}
      }
    }
    const jsonMatch = text && text.match(/\[[\s\S]*\]/);
    if (jsonMatch) {
      const parsed = JSON.parse(jsonMatch[0]);
      if (expAiScope === "advisor") {
        try { localStorage.setItem("hx-ai-advisor-cards", JSON.stringify(parsed)); } catch (e) {}
      } else {
        parsed.forEach(it => {
          if (it && it.m && it.cat && CATS[it.cat]) {
            aiSuggestedCats[it.m] = { cat: it.cat, reason: it.reason || "" };
          }
        });
        try { localStorage.setItem("hx-ai-suggestions", JSON.stringify(aiSuggestedCats)); } catch (e) {}
        expAiScope = "other";
      }
    }
    if (sources.length) {
      srcBox.hidden = false;
      srcBox.innerHTML = `<span>${esc(t("aiSourcesLbl"))}</span>` + sources.slice(0, 5).map(s =>
        `<a href="${esc(s.uri)}" target="_blank" rel="noopener">${ico("external-link")} ${esc(s.title || new URL(s.uri).hostname)}</a>`
      ).join("");
    }
  } catch (e) {} finally {
    loader.hidden = true;
    expAiLoading = false;
    btn.disabled = false;
    renderExpAiPanel();
  }
}

  const f = $("expAiKeyForm");
  f.hidden = !f.hidden;
  $("expAiKeyBtn").setAttribute("aria-expanded", String(!f.hidden));
  if (!f.hidden) { $("expAiKeyInput").value = getApiKey(); $("expAiKeyInput").focus(); }
});
$("expAiKeyToggle").addEventListener("click", () => {
  const inp = $("expAiKeyInput"), btn = $("expAiKeyToggle");
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  btn.setAttribute("aria-pressed", String(show));
  btn.innerHTML = ico(show ? "eye-off" : "eye");
});
$("expAiKeyForm").addEventListener("submit", e => {
  e.preventDefault();
  const val = $("expAiKeyInput").value.trim();
  try {
    if (val) localStorage.setItem("gemini-api-key", val);
    else localStorage.removeItem("gemini-api-key");
  } catch (err) {}
  $("expAiKeyForm").hidden = true;
  $("expAiKeyBtn").setAttribute("aria-expanded", "false");
  renderExpAiPanel();
});
$("expAiResetBtn").addEventListener("click", () => {
  customCats = {};
  try { localStorage.removeItem("hx-custom-cats"); } catch (e) {}
  render();
});
$("expAiExportBtn").addEventListener("click", () => {
  const merged = {};
  TX.forEach(r => { merged[r.m] = txCat(r); });
  const blob = new Blob([JSON.stringify(merged, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "merchant_cats.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
$("expAiFetchBtn").addEventListener("click", runGeminiExpenseAi);

function render() {
  renderHeader();
  const rows = filtered();
  renderKpis(rows); renderMonthly(); renderCats(); renderMerchants(rows); renderTable(rows); renderChips(rows.length); renderExpAiPanel();
  try { localStorage.setItem(STORAGE_FILTERS_KEY, JSON.stringify({ owner: state.owner, bank: state.bank, year: state.year })); } catch (e) {}
}

$("ownerSeg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b && b.dataset.owner) {
    state.owner = b.dataset.owner;
    if (state.owner !== "all" && state.bank === "Alpha (Αρετή)") state.bank = "all";
    if (state.owner === "areti") state.bank = "all";
    state.shown = 60;
    render();
  }
});
$("yearSeg").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.drill) { yearSegExpanded = !yearSegExpanded; renderYearSeg(); return; }
  state.year = b.dataset.year;
  if (YEARS.slice(-2).includes(state.year)) yearSegExpanded = false;
  state.month = ""; state.shown = 60;
  render();
});
$("bankSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.bank) { state.bank = b.dataset.bank; state.shown = 60; render(); } });
$("mobSearchBtn").addEventListener("click", () => { const isOpen = $("searchWrap").classList.toggle("is-open"); $("mobSearchBtn").classList.toggle("is-open", isOpen); if (isOpen) $("q").focus(); });
$("monthSel").addEventListener("change", e => { state.month = e.target.value; state.shown = 60; render(); });
$("monthPrev").addEventListener("click", () => {
  const ms = monthsWithData(state.year);
  if (!ms.length) return;
  if (!state.month) state.month = ms[ms.length - 1];
  else { const i = ms.indexOf(state.month); if (i > 0) state.month = ms[i - 1]; }
  state.shown = 60; render();
});
$("monthNext").addEventListener("click", () => {
  const ms = monthsWithData(state.year);
  if (!ms.length || !state.month) return;
  const i = ms.indexOf(state.month);
  state.month = (i >= 0 && i < ms.length - 1) ? ms[i + 1] : "";
  state.shown = 60; render();
});
$("q").addEventListener("input", e => { state.q = e.target.value; state.shown = 60; render(); });
$("qClear").addEventListener("click", () => { state.q = ""; $("q").value = ""; $("q").focus(); state.shown = 60; render(); });
$("moreBtn").addEventListener("click", () => { state.shown += 100; renderTable(filtered()); });
document.querySelectorAll("th [data-sort]").forEach(b => b.addEventListener("click", () => {
  if (state.sort === b.dataset.sort) state.dir *= -1; else { state.sort = b.dataset.sort; state.dir = -1; }
  renderTable(filtered());
}));
let rz, lastW = 0;
new ResizeObserver(() => { const w = $("monthly").clientWidth; if (Math.abs(w - lastW) < 2) return; lastW = w; clearTimeout(rz); rz = setTimeout(renderMonthly, 80); }).observe($("monthly"));
setFormats(); applyStatic(); renderYearSeg(); render();
</script>
